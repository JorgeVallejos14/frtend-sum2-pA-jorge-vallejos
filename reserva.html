<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva - ViajarYa</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script>
        function toggleOtroDestino(select) {
            const otroDestinoInput = document.getElementById('otro-destino');
            otroDestinoInput.style.display = select.value === 'otro' ? 'block' : 'none';
        }

        function toggleAdultosMayores(checkbox) {
            const cantidadMayores = document.getElementById('cantidad-mayores');
            cantidadMayores.style.display = checkbox.checked ? 'block' : 'none';
        }

        function toggleNecesidadesEspeciales(checkbox) {
            const detallesNecesidades = document.getElementById('detalles-necesidades');
            detallesNecesidades.style.display = checkbox.checked ? 'block' : 'none';
        }

        function actualizarContador() {
            const comentarios = document.getElementById('comentarios');
            const contador = document.getElementById('contador');
            contador.textContent = `${comentarios.value.length}/300`;
        }
    </script>
</head>
<body>
    <h1>Formulario de Reserva</h1>

    <!-- Sección A - Datos del Viaje -->
    <section>
        <h2>A - Datos del Viaje</h2>
        <form>
            <label for="destino">Destino de Interés:</label>
            <select id="destino" name="destino" onchange="toggleOtroDestino(this)" required>
                <optgroup label="América del Sur">
                    <option value="buenos-aires">Buenos Aires</option>
                    <option value="rio-de-janeiro">Río de Janeiro</option>
                </optgroup>
                <optgroup label="Europa">
                    <option value="paris">París</option>
                    <option value="roma">Roma</option>
                </optgroup>
                <optgroup label="Asia">
                    <option value="tokio">Tokio</option>
                    <option value="bangkok">Bangkok</option>
                </optgroup>
                <optgroup label="Caribe">
                    <option value="cancun">Cancún</option>
                    <option value="punta-cana">Punta Cana</option>
                </optgroup>
                <optgroup label="Otros">
                    <option value="otro">Otro</option>
                </optgroup>
            </select>
            <input type="text" id="otro-destino" name="otro-destino" placeholder="Especificar ciudad" style="display: none;">

            <p>Tipo de Paquete:</p>
            <label><input type="radio" name="paquete" value="todo-incluido" required> Todo Incluido</label>
            <label><input type="radio" name="paquete" value="aereo-hotel"> Solo Aéreo + Hotel</label>
            <label><input type="radio" name="paquete" value="crucero"> Crucero</label>
            <label><input type="radio" name="paquete" value="egresados"> Viaje de Egresados</label>
            <label><input type="radio" name="paquete" value="a-medida"> A Medida</label>

            <label for="fecha-salida">Fecha de Salida Deseada:</label>
            <input type="date" id="fecha-salida" name="fecha-salida" required>

            <label for="fecha-regreso">Fecha de Regreso Deseada:</label>
            <input type="date" id="fecha-regreso" name="fecha-regreso" required>

            <label for="duracion">Duración Aproximada:</label>
            <select id="duracion" name="duracion" required>
                <option value="3-5-dias">3 a 5 días</option>
                <option value="1-semana">1 semana</option>
                <option value="2-semanas">2 semanas</option>
                <option value="mas-2-semanas">Más de 2 semanas</option>
            </select>

            <label><input type="checkbox" name="flexibilidad"> Mis fechas son flexibles más o menos 3 días</label>

            <label for="puerto-salida">Puerto de Salida Preferido:</label>
            <select id="puerto-salida" name="puerto-salida" required>
                <option value="buenos-aires">Buenos Aires</option>
                <option value="cordoba">Córdoba</option>
                <option value="rosario">Rosario</option>
                <option value="otro">Otro</option>
            </select>
            <input type="text" id="otro-puerto" name="otro-puerto" placeholder="Especificar ciudad" style="display: none;">
        </form>
    </section>

    <!-- Sección B - Datos de los Pasajeros -->
    <section>
        <h2>B - Datos de los Pasajeros</h2>
        <form>
            <label for="adultos">Cantidad de Adultos:</label>
            <input type="number" id="adultos" name="adultos" min="1" max="10" required>

            <label for="menores">Cantidad de Menores:</label>
            <input type="number" id="menores" name="menores" min="0" max="8">

            <label><input type="checkbox" name="adultos-mayores" onchange="toggleAdultosMayores(this)"> Viaja con Adultos Mayores</label>
            <input type="number" id="cantidad-mayores" name="cantidad-mayores" min="1" max="10" placeholder="Cantidad" style="display: none;">

            <h3>Datos del Pasajero Principal</h3>
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="documento">Número de Pasaporte o DNI:</label>
            <input type="text" id="documento" name="documento" required>

            <label for="fecha-nacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" required>

            <label for="nacionalidad">Nacionalidad:</label>
            <select id="nacionalidad" name="nacionalidad" required>
                <option value="argentina">Argentina</option>
                <option value="brasil">Brasil</option>
                <option value="chile">Chile</option>
                <option value="otro">Otro</option>
            </select>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>

            <label for="telefono">Teléfono de Contacto:</label>
            <input type="tel" id="telefono" name="telefono" required>

            <label><input type="checkbox" name="necesidades-especiales" onchange="toggleNecesidadesEspeciales(this)"> Necesidades Especiales</label>
            <textarea id="detalles-necesidades" name="detalles-necesidades" placeholder="Detalle sus necesidades" style="display: none;"></textarea>
        </form>
    </section>

    <!-- Sección C - Preferencias y Servicios Adicionales -->
    <section>
        <h2>C - Preferencias y Servicios Adicionales</h2>
        <form>
            <p>Tipo de Habitación Preferida:</p>
            <label><input type="radio" name="habitacion" value="simple" required> Simple</label>
            <label><input type="radio" name="habitacion" value="doble"> Doble</label>
            <label><input type="radio" name="habitacion" value="triple"> Triple</label>
            <label><input type="radio" name="habitacion" value="suite"> Suite</label>

            <label for="regimen-comidas">Régimen de Comidas:</label>
            <select id="regimen-comidas" name="regimen-comidas" required>
                <option value="solo-alojamiento">Solo Alojamiento</option>
                <option value="desayuno-incluido">Desayuno Incluido</option>
                <option value="media-pension">Media Pensión</option>
                <option value="pension-completa">Pensión Completa</option>
                <option value="todo-incluido">Todo Incluido</option>
            </select>

            <p>Servicios Adicionales:</p>
            <label><input type="checkbox" name="servicios" value="seguro-viaje"> Seguro de Viaje</label>
            <label><input type="checkbox" name="servicios" value="traslado-aeropuerto"> Traslado Aeropuerto</label>
            <label><input type="checkbox" name="servicios" value="excursiones-incluidas"> Excursiones Incluidas</label>
            <label><input type="checkbox" name="servicios" value="guia-espanol"> Guía en Español</label>
            <label><input type="checkbox" name="servicios" value="visa-incluida"> Visa Incluida</label>

            <label for="presupuesto">Presupuesto Estimado por Persona:</label>
            <select id="presupuesto" name="presupuesto" required>
                <option value="menos-500">Menos de USD 500</option>
                <option value="500-1000">USD 500 a 1000</option>
                <option value="1000-2500">USD 1000 a 2500</option>
                <option value="2500-5000">USD 2500 a 5000</option>
                <option value="sin-limites">Sin Límites Definidos</option>
            </select>

            <label for="como-se-entero">¿Cómo se enteró de ViajarYa?</label>
            <select id="como-se-entero" name="como-se-entero" required>
                <option value="redes-sociales">Redes Sociales</option>
                <option value="recomendacion">Recomendación</option>
                <option value="busqueda-web">Búsqueda Web</option>
                <option value="publicidad">Publicidad</option>
                <option value="cliente">Ya Soy Cliente</option>
            </select>
        </form>
    </section>

    <!-- Sección D - Comentarios y Confirmación -->
    <section>
        <h2>D - Comentarios y Confirmación</h2>
        <form>
            <label for="comentarios">Comentarios o Pedidos Especiales:</label>
            <textarea id="comentarios" name="comentarios" maxlength="300" oninput="actualizarContador()"></textarea>
            <p id="contador">0/300</p>

            <label><input type="checkbox" name="ofertas"> Deseo recibir ofertas por correo electrónico</label>

            <label><input type="checkbox" name="terminos" required> Acepto los <a href="#">términos y condiciones</a></label>

            <label><input type="checkbox" name="privacidad" required> Acepto la <a href="#">política de privacidad</a> y el tratamiento de datos personales</label>

            <div style="text-align: center; margin-top: 1rem;">
                <button type="submit" style="background-color: #007BFF; color: white; padding: 0.5rem 1rem; border: none; cursor: pointer;">Solicitar Reserva</button>
                <button type="reset" style="background-color: #f0f0f0; color: #333; padding: 0.5rem 1rem; border: 1px solid #ccc; cursor: pointer;">Limpiar</button>
                <a href="index.html" style="display: inline-block; margin-top: 1rem; color: #007BFF; text-decoration: none;">Volver al Inicio</a>
            </div>
        </form>
    </section>
</body>
</html>
